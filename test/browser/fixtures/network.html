<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Network graph regression fixture</title>
    <link rel="stylesheet" href="/network-test/style.css">
    <script type="importmap">
      { "imports": { "vue": "/network-test/vue.js", "@eightkk/vue-weave": "/network-test/index.js" } }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, ref, shallowRef } from 'vue'
      import { NetworkGraph, layoutLayeredGraph } from '@eightkk/vue-weave'

      // Query parameters pick the scenario: nodes, cull, draggable, minimap, preset=groups, match, dir,
      // edgeselect (controlled edge selection), delete, menu (context menu events), tooltip, snap (grid size),
      // guides, autopan, drop, clipboard, background (dots or lines), slots (counting node and edge slots), connectable,
      // groups=chain (the chain in groups of ten, five to a parent group), reads (counting reads of node fields),
      // highlight and highlightedges (comma-separated highlighted IDs), targets (logging target-* events), collapse
      // (comma-separated controlled collapsed group IDs), preset=ports (A to D with named ports on A and B and an
      // external route for edge ab), policy (routingPolicy), style (edgeStyle), gestures (logging gesture-* events),
      // boxselect, editableedges, resizable, labels (editableLabels, logging label-edit proposals), edgelabels (a label
      // on every edge), labelplacement (edgeLabelPlacement) and reconnectable. Every edit proposal is logged by event
      // name in "Edit proposals" and passed through structuredClone; a payload that cannot be cloned is reported in
      // "Clone errors".
      const query = new URLSearchParams(location.search)
      const preset = query.get('preset')
      const ids = preset === 'groups' || preset === 'ports'
        ? ['A', 'B', 'C', 'D']
        : Array.from({ length: Number(query.get('nodes') ?? 600) }, (_, i) => 'N' + String(i).padStart(4, '0'))
      const reads = { count: 0 }
      const nodes = ids.map(id => query.get('reads') === '1'
        ? new Proxy({ id, label: id }, { get: (target, key) => { reads.count++; return target[key] } })
        : { id, label: id })
      const edges = ids.slice(1).map((id, i) => ({ id: 'e' + i, from: ids[i], to: id, ...query.get('edgelabels') === '1' && { label: 'link ' + i } }))
      if (preset === 'ports') {
        nodes[0].ports = [{ id: 'out', side: 'right', offset: 0.25 }]
        nodes[1].ports = [{ id: 'in', side: 'left' }]
        edges[0] = { id: 'ab', from: 'A', to: 'B', fromPort: 'out', toPort: 'in' }
      }
      // An external engine's result: the layered layout with a polyline of its own between the ports of edge ab.
      const external = { path: '' }
      const portLayout = (shownNodes, shownEdges) => {
        const base = layoutLayeredGraph(shownNodes, shownEdges)
        const a = base.boxes.get('A'), b = base.boxes.get('B')
        if (!a || !b || !shownEdges.some(edge => edge.id === 'ab')) return base
        const from = { x: a.x + a.width, y: a.y + a.height * 0.25 }, to = { x: b.x, y: b.y + b.height / 2 }
        const middle = (from.x + to.x) / 2
        external.path = `M ${from.x} ${from.y} L ${middle} ${from.y} L ${middle} ${to.y} L ${to.x} ${to.y}`
        return { ...base, paths: new Map(base.paths).set('ab', external.path) }
      }
      // Created once: a new collapsed set on every render would rebuild the layout and re-fit the camera each time.
      const lists = {}
      const list = name => query.has(name) ? (lists[name] ??= new Set(query.get(name).split(','))) : undefined
      const targetLog = ref([])
      const logTarget = type => event => {
        const { target, source } = event
        targetLog.value = [...targetLog.value, `${type} ${target.kind} ${target.id} ${source}`].slice(-8)
      }
      const chainGroups = () => {
        const list = []
        for (let start = 0; start < ids.length; start += 10) {
          const index = start / 10, parent = Math.floor(index / 5)
          if (index % 5 === 0) list.push({ id: 'p' + parent, label: 'Parent ' + parent, nodeIds: [] })
          list.push({ id: 'g' + index, label: 'Group ' + index, parentId: 'p' + parent, nodeIds: ids.slice(start, start + 10) })
        }
        return list
      }
      const groups = query.get('preset') === 'groups' ? [
        { id: 'inner', label: 'Inner', nodeIds: ['C', 'D'], parentId: 'outer' },
        { id: 'outer', label: 'Outer', nodeIds: ['B'] },
      ] : query.get('groups') === 'chain' ? chainGroups() : undefined
      const matchIds = query.has('match') ? new Set(query.get('match').split(',')) : undefined

      // gestures=1: every gesture-start and gesture-end in order, and the number of gestures still open.
      const gestureLog = ref([])
      const openGestures = ref(0)
      const gestureListeners = query.get('gestures') === '1' ? {
        onGestureStart: ({ kind, source }) => {
          openGestures.value++
          gestureLog.value = [...gestureLog.value, `start ${kind} ${source}`]
        },
        onGestureEnd: ({ kind, source, outcome }) => {
          openGestures.value--
          gestureLog.value = [...gestureLog.value, `end ${kind} ${source} ${outcome}`]
        },
      } : {}

      const graph = ref()
      const selectedId = ref('')
      const positions = shallowRef(new Map())
      const lastMove = ref('')
      const moveEvents = ref(0)
      const viewportEvents = ref(0)
      function applyMoves(changes) {
        const next = new Map(positions.value)
        for (const change of changes) next.set(change.id, change.after)
        positions.value = next
        lastMove.value = changes.map(change => change.id).sort().join(',')
        lastAfter.value = JSON.stringify(Object.fromEntries(changes.map(change => [change.id, change.after])))
        moveEvents.value++
      }
      const lastAfter = ref('')
      const lastLabel = ref('')
      const proposalLog = ref([])
      const cloneErrors = ref('')
      const record = (name, payload) => {
        try {
          structuredClone(payload)
        } catch (error) {
          cloneErrors.value += name + ': ' + error.name + ' '
        }
        proposalLog.value = [...proposalLog.value, name].slice(-8)
      }
      const lastDrop = ref('')
      const lastCopy = ref('')
      const lastPaste = ref('')
      const lastDuplicate = ref('')
      const nativeEvents = ref('')
      const selection = payload => JSON.stringify({ ...payload, positions: Object.fromEntries(payload.positions) })
      const selectedEdgeIds = shallowRef(new Set())
      const lastMenu = ref('')
      const menuEvents = ref(0)
      const lastDeletion = ref('')
      const tooltip = ({ target }) => h('span', 'Tip ' + (target.kind === 'node' ? target.node.label : target.edge.id))
      // slots=1 renders nodes and edges through counting slots, so tests can see how many items re-render.
      const renders = { node: 0, edge: 0 }
      const itemSlots = query.get('slots') === '1' ? {
        node: ({ node, box }) => {
          renders.node++
          return h('rect', { class: 'vw-test-node', width: box.width, height: box.height }, [])
        },
        edge: ({ edge, path }) => {
          renders.edge++
          return h('path', { class: 'vw-test-edge', d: path, 'data-edge': edge.id })
        },
      } : {}
      // Moves the first node in the source positions, as a data refresh during a gesture would.
      const refresh = () => {
        const box = layoutLayeredGraph(nodes, edges).boxes.get(ids[0])
        const current = positions.value.get(ids[0]) ?? { x: box.x, y: box.y }
        positions.value = new Map(positions.value).set(ids[0], { x: current.x + 7, y: current.y + 3 })
      }
      const clearGestureLog = () => { gestureLog.value = [] }
      window.__vw = { graph: () => graph.value, renders, reads, external, refresh, clearGestureLog }

      createApp({
        render: () => h('main', [
          h('output', { role: 'status', 'aria-label': 'Last move' }, lastMove.value),
          h('output', { role: 'status', 'aria-label': 'Move events' }, String(moveEvents.value)),
          h('output', { role: 'status', 'aria-label': 'Viewport events' }, String(viewportEvents.value)),
          h('output', { role: 'status', 'aria-label': 'Last menu' }, lastMenu.value),
          h('output', { role: 'status', 'aria-label': 'Menu events' }, String(menuEvents.value)),
          h('output', { role: 'status', 'aria-label': 'Last deletion' }, lastDeletion.value),
          h('output', { role: 'status', 'aria-label': 'Last after' }, lastAfter.value),
          h('output', { role: 'status', 'aria-label': 'Last drop' }, lastDrop.value),
          h('output', { role: 'status', 'aria-label': 'Last copy' }, lastCopy.value),
          h('output', { role: 'status', 'aria-label': 'Last paste' }, lastPaste.value),
          h('output', { role: 'status', 'aria-label': 'Last duplicate' }, lastDuplicate.value),
          h('output', { role: 'status', 'aria-label': 'Native events' }, nativeEvents.value),
          h('output', { role: 'status', 'aria-label': 'Target events' }, targetLog.value.join(' | ')),
          h('output', { role: 'status', 'aria-label': 'Gesture events' }, gestureLog.value.join(' | ')),
          h('output', { role: 'status', 'aria-label': 'Open gestures' }, String(openGestures.value)),
          h('output', { role: 'status', 'aria-label': 'Last label' }, lastLabel.value),
          h('output', { role: 'status', 'aria-label': 'Edit proposals' }, proposalLog.value.join(' ')),
          h('output', { role: 'status', 'aria-label': 'Clone errors' }, cloneErrors.value),
          h(NetworkGraph, {
            highlightedNodeIds: list('highlight'), highlightedEdgeIds: list('highlightedges'), collapsedGroupIds: list('collapse'),
            routingPolicy: query.get('policy') ?? undefined, edgeStyle: query.get('style') ?? undefined,
            edgeLabelPlacement: query.get('labelplacement') ?? undefined,
            layout: preset === 'ports' ? portLayout : undefined,
            ...query.get('targets') === '1' ? {
              onTargetEnter: logTarget('enter'), onTargetLeave: logTarget('leave'), onTargetActivate: logTarget('activate'),
            } : {},
            ...gestureListeners,
            boxSelect: query.get('boxselect') === '1', editableEdges: query.get('editableedges') === '1',
            resizable: query.get('resizable') === '1',
            editableLabels: query.get('labels') === '1',
            onLabelEdit: change => { lastLabel.value = JSON.stringify(change) },
            ref: graph, nodes, edges, groups, matchIds, height: 360, dir: query.get('dir') ?? undefined,
            cullOffscreen: query.get('cull') === '1', showMinimap: query.get('minimap') === '1',
            draggable: query.get('draggable') === '1', connectable: query.get('connectable') === '1', positions: positions.value,
            selectedId: selectedId.value,
            'onUpdate:selectedId': id => { selectedId.value = id },
            onNodeMove: change => {
              record('node-move', change)
              applyMoves([change])
            },
            onNodesMove: changes => {
              record('nodes-move', changes)
              applyMoves(changes)
            },
            reconnectable: query.get('reconnectable') === '1',
            onReconnect: change => record('reconnect', change),
            onConnect: connection => record('connect', connection),
            onNodeResize: change => record('node-resize', change),
            onEdgeReshape: change => record('edge-reshape', change),
            onViewportChange: () => { viewportEvents.value++ },
            edgesSelectable: query.get('edgeselect') === '1',
            selectedEdgeIds: query.get('edgeselect') === '1' ? selectedEdgeIds.value : undefined,
            'onUpdate:selectedEdgeIds': ids => { selectedEdgeIds.value = ids },
            deletable: query.get('delete') === '1',
            onDelete: deletion => { lastDeletion.value = JSON.stringify(deletion) },
            snapGrid: query.has('snap') ? Number(query.get('snap')) : undefined,
            alignmentGuides: query.get('guides') === '1',
            autoPan: query.get('autopan') === '1',
            background: query.get('background') ?? undefined,
            droppable: query.get('drop') === '1',
            onNodeDrop: drop => {
              lastDrop.value = JSON.stringify({ point: drop.point, clientX: drop.clientX, clientY: drop.clientY, text: drop.dataTransfer?.getData('text/plain') })
            },
            clipboard: query.get('clipboard') === '1',
            onCopySelection: payload => { lastCopy.value = selection(payload) },
            onPasteRequest: payload => { lastPaste.value = JSON.stringify(payload) },
            onDuplicateSelection: payload => { lastDuplicate.value = selection(payload) },
            // Native listeners fall through to the root element because no component event shadows them.
            ...query.get('native') === '1' ? {
              onCopy: event => { nativeEvents.value += event.type + ' ' },
              onPaste: event => { nativeEvents.value += event.type + ' ' },
              onDrop: event => { nativeEvents.value += event.type + ' ' },
            } : {},
            contextMenu: query.get('menu') === '1',
            onContextMenu: request => {
              lastMenu.value = JSON.stringify(request)
              menuEvents.value++
            },
          }, query.get('tooltip') === '1' ? { ...itemSlots, tooltip } : query.get('slots') === '1' ? itemSlots : undefined),
        ]),
      }).mount('#app')
    </script>
  </body>
</html>
