<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gantt regression fixture</title>
    <link rel="stylesheet" href="/gantt-test/style.css">
    <script type="importmap">
      { "imports": { "vue": "/gantt-test/vue.js", "vue-weave": "/gantt-test/index.js" } }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, ref } from 'vue'
      import { GanttChart } from 'vue-weave'

      // Query parameters pick the scenario: readonly, rowDraggable, rtl, controlled (the parent ignores zoom preset updates).
      const query = new URLSearchParams(location.search)
      const rows = [{ id: 'r1', label: 'Row 1' }, { id: 'r2', label: 'Row 2' }]
      const bars = [
        { id: 'a', rowId: 'r1', label: 'Task A', start: 0, end: 2, editable: true },
        { id: 'b', rowId: 'r2', label: 'Task B', start: 4, end: 6, editable: true },
      ]
      const dependencies = [{ id: 'ab', from: 'a', to: 'b' }]
      const range = { start: 0, end: 200 }
      const tickSteps = [1]
      const zoomPresets = [
        { id: 'wide', label: 'Wide', pixelsPerUnit: 50, tickSteps },
        { id: 'narrow', label: 'Narrow', pixelsPerUnit: 25, tickSteps },
      ]
      const preset = ref('wide')
      const lastEdit = ref('')
      const deletes = ref(0)
      const selects = ref(0)
      const connects = ref(0)
      const zoomEvents = ref([])
      const output = (label, value) => h('output', { role: 'status', 'aria-label': label }, String(value))
      const controlled = query.has('controlled')

      createApp({
        render: () => h('main', [
          h('button', { type: 'button', onClick: () => { preset.value = 'narrow' } }, 'Parent switches to Narrow'),
          output('Last edit', lastEdit.value),
          output('Dependency deletes', deletes.value),
          output('Dependency selects', selects.value),
          output('Connections', connects.value),
          output('Zoom events', zoomEvents.value.join(';')),
          h(GanttChart, {
            rows, bars, dependencies, range, tickSteps, zoomPresets, pixelsPerUnit: 50, snap: 1, formatTime: String,
            height: 240, autoScroll: false, connectable: true, reconnectable: true,
            markers: [{ id: 'm', time: 5, label: 'Review' }], showNow: true, now: 3, dir: query.has('rtl') ? 'rtl' : undefined,
            readonly: query.has('readonly'), rowDraggable: query.has('rowDraggable'),
            ...(controlled ? { zoomPreset: preset.value } : {}),
            onEdit: change => { lastEdit.value = JSON.stringify(change) },
            onDependencyDelete: () => { deletes.value++ },
            onDependencySelect: () => { selects.value++ },
            onConnect: () => { connects.value++ },
            onZoomChange: change => { zoomEvents.value.push(change.zoom + '/' + (change.preset ?? '')) },
          }),
        ]),
      }).mount('#app')
    </script>
  </body>
</html>
