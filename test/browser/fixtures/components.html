<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Component regression fixture</title>
    <link rel="stylesheet" href="/component-test/style.css">
    <script type="importmap">
      { "imports": { "vue": "/component-test/vue.js", "vue-weave": "/component-test/index.js" } }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, ref, shallowRef } from 'vue'
      import { GanttChart, NetworkGraph } from 'vue-weave'

      const validRows = [{ id: 'a', label: 'Row A' }]
      const range = { start: 0, end: 10 }
      const tickSteps = [1]
      const rows = shallowRef(validRows)
      const bars = shallowRef([{ id: 'bar', rowId: 'a', label: 'Editable bar', start: 1, end: 3, editable: true }])
      const nodes = shallowRef([{ id: 'a', label: 'Node A' }])
      const direction = ref('LR')
      const validationMessages = ref([])
      const edits = ref(0)
      const reportedErrors = new WeakSet()
      const control = (label, action) => h('button', { type: 'button', onClick: action }, label)

      const app = createApp({
        render: () => h('main', [
          h('section', { 'aria-label': 'Timeline fixture' }, [
            control('Missing parent', () => { rows.value = [{ id: 'a', label: 'Row A', parentId: 'missing' }] }),
            control('Cyclic rows', () => { rows.value = [{ id: 'a', label: 'Row A', parentId: 'b' }, { id: 'b', label: 'Row B', parentId: 'a' }] }),
            control('Restore rows', () => { rows.value = [...validRows] }),
            h('output', { role: 'status', 'aria-label': 'Validation reports' }, validationMessages.value.join('; ')),
            h('output', { role: 'status', 'aria-label': 'Accepted edits' }, String(edits.value)),
            h(GanttChart, {
              rows: rows.value, bars: bars.value, range,
              pixelsPerUnit: 100, tickSteps, snap: 1, formatTime: String,
              height: 200, showControls: false, autoScroll: false,
              onValidationError: error => {
                reportedErrors.add(error)
                validationMessages.value.push(error.message)
              },
              onEdit: change => {
                edits.value++
                bars.value = bars.value.map(bar => bar.id === change.id ? { ...bar, ...change.after } : bar)
              },
            }),
          ]),
          h('section', { 'aria-label': 'Graph fixture' }, [
            control('Empty graph', () => { nodes.value = [] }),
            control('Restore nodes', () => { nodes.value = [{ id: 'a', label: 'Node A' }] }),
            control('LR direction', () => { direction.value = 'LR' }),
            control('TB direction', () => { direction.value = 'TB' }),
            h(NetworkGraph, { nodes: nodes.value, edges: [], options: { padding: 0, direction: direction.value } }),
          ]),
        ]),
      })
      // Validation failures are deliberately rethrown by the component; unrelated failures must reach Playwright.
      app.config.errorHandler = error => {
        if (!reportedErrors.has(error)) throw error
      }
      app.mount('#app')
    </script>
  </body>
</html>
