version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # vue-tsc requires the JavaScript compiler API missing from standard TypeScript 7.0.
    # Revisit this hold after upstream support and the declaration-consumer checks pass.
    ignore:
      - dependency-name: typescript
        versions: ['>=7.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
