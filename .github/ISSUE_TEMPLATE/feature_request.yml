name: Feature request
description: Describe a use case and proposed improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the workflow and why current behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example of how you would use the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility
      description: Describe workarounds, alternatives and effects on existing usage.
